<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PR walkthrough</title>
<style>
  :root {
    --bg: #0f1116; --panel: #161921; --panel2: #1b1e27; --line: #2a2e3b; --fg: #e3e6ec; --dim: #8b92a3;
    --blue: #6eaaff; --green: #5fd38a; --red: #f07a7a; --amber: #ffbe5a; --violet: #c38cff;
    --mono: "SF Mono", Menlo, monospace; --lh: 21px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.4 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  body.mode-tour { height: 100%; overflow: hidden; }
  body.mode-tour #read, body.mode-read #tour { display: none; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }

  /* ================= tour (fixed 1280x720 stage) ================= */
  #tour { position: fixed; inset: 0; overflow: hidden; }
  /* Pinned by its center rather than grid-centered: a 1280px stage overflows a narrower grid track from the left edge. */
  #stage { width: 1280px; height: 720px; position: absolute; left: 50%; top: 50%; overflow: hidden; transform-origin: center; background: var(--bg);
    user-select: none; -webkit-user-select: none; }
  .cd, .note .txt, .note .ref, .item .ref, .item .txt, .tests .t .name, .srow .sp, .w { user-select: text; -webkit-user-select: text; }
  #glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; left: -300px; top: -500px;
    background: radial-gradient(circle, rgba(110,170,255,.10), rgba(110,170,255,0) 65%); pointer-events: none; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .scene:not(.active) { pointer-events: none; visibility: hidden; }
  .scene.active, .scene.near { visibility: visible; }
  .head { position: absolute; left: 56px; top: 30px; right: 56px; }
  .kicker { color: var(--blue); font-size: 13px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
  h1 { margin: 0; font-size: 30px; letter-spacing: -.4px; }

  .pane { position: absolute; left: 56px; top: 112px; width: 812px; height: 452px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .pane.wide { width: 1168px; } .pane.narrow { width: 640px; }
  .scroll { position: absolute; left: 0; right: 0; top: 0; padding: 0 0 20px; }
  .side { position: absolute; left: 890px; top: 112px; width: 334px; display: flex; flex-direction: column; gap: 12px; }
  .side.wide { left: 718px; width: 506px; }

  /* ================= shared code rows ================= */
  .hunk { margin-bottom: 14px; }
  .hhead { height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--panel2);
    border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; }
  .hunk:first-child .hhead { border-top: 0; }
  .hhead .dir { color: var(--dim); } .hhead .base { color: var(--fg); font-weight: 600; }
  .hhead .rng { margin-left: auto; color: var(--dim); }
  .hhead .newf { color: var(--green); border: 1px solid var(--green); border-radius: 4px; padding: 0 5px; font-size: 10.5px; }
  .hbody { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: #343a4a transparent; }
  .hbody::-webkit-scrollbar { height: 7px; } .hbody::-webkit-scrollbar-thumb { background: #343a4a; border-radius: 4px; }
  .rows { width: max-content; min-width: 100%; }
  .row { height: var(--lh); overflow: hidden; position: relative; display: flex;
    font-family: var(--mono); font-size: 12.5px; line-height: var(--lh); white-space: pre; tab-size: 4; }
  .gut { position: sticky; left: 0; z-index: 1; flex: none; display: inline-grid; grid-template-columns: 40px 40px 18px; background: var(--panel); }
  .row .ln { color: #4d5466; text-align: right; padding-right: 8px; }
  .row .sg { color: var(--dim); text-align: center; }
  .row .cd { padding: 0 16px 0 2px; }
  .row.add { background: rgba(95,211,138,.11); } .row.add .gut { background: #1e2e2d; } .row.add .sg { color: var(--green); }
  .row.del { background: rgba(240,122,122,.11); } .row.del .gut { background: #2e242b; } .row.del .sg { color: var(--red); }
  .row.add.newfile { background: rgba(95,211,138,.045); } .row.add.newfile .gut { background: #192126; }
  .row.cos .sg { color: #5a6175; } .row.cos .cd { opacity: .75; }
  .row.mod .sg { color: var(--amber); }
  .row .strike { position: absolute; left: 100px; right: 12px; top: 50%; height: 1px; background: rgba(240,122,122,.7); transform-origin: left center; }
  mark.x-ins { background: rgba(95,211,138,.28); color: inherit; border-radius: 3px; }
  mark.x-del { background: rgba(240,122,122,.3); color: inherit; border-radius: 3px; }
  .row.add mark.x-ins { background: rgba(95,211,138,.34); }

  /* pygments, namespaced so they can't restyle our own classes */
  .t-k, .t-kd, .t-kn, .t-kr, .t-kc, .t-kp { color: #c792ea; } .t-kt, .t-nc { color: #82aaff; }
  .t-s, .t-s1, .t-s2, .t-sr, .t-sb, .t-sc, .t-sd, .t-sh, .t-sx { color: #a8d88a; } .t-se, .t-si { color: #89ddff; }
  .t-c, .t-c1, .t-cm, .t-cp, .t-ch, .t-cs, .t-cpf { color: #6b7389; font-style: italic; }
  .t-m, .t-mi, .t-mf, .t-mh, .t-mo, .t-mb, .t-il { color: #f5a76c; }
  .t-nf, .t-fm { color: #82aaff; } .t-nb, .t-bp { color: #89ddff; } .t-o, .t-p, .t-ow { color: #a9b1c6; }
  .t-nt { color: #82aaff; } .t-na { color: #c792ea; } .t-ni { color: #f5a76c; }

  /* ================= notes ================= */
  .note { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--blue); border-radius: 10px; padding: 12px 14px; }
  .note.review { border-left-color: var(--amber); background: #1f1d1a; }
  .note .tag { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--blue); margin-bottom: 4px; }
  .note.review .tag { color: var(--amber); }
  .note .txt { font-size: 14.5px; line-height: 1.45; }
  .note .ref { font-family: var(--mono); font-size: 11.5px; color: var(--dim); margin-top: 6px; display: inline-block; }
  .note code, .w code, .item code { font-family: var(--mono); font-size: .88em; background: #252935; padding: 0 4px; border-radius: 4px; }

  /* ================= widgets (data-driven; see reference/spec.md) ================= */
  .w { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; }
  .w-title { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--violet); margin-bottom: 8px; text-transform: uppercase; }
  .w-table { display: grid; gap: 4px 8px; align-items: start; }
  .w-table .h { color: var(--dim); font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; }
  .w-table .c { padding: 3px 7px; border-radius: 5px; background: #252935; line-height: 1.5; }
  .w-table .c.mono { font-family: var(--mono); font-size: 12px; }
  .tone-ok { color: var(--green); } .tone-bad { color: var(--red); } .tone-warn { color: var(--amber); } .tone-dim { color: var(--dim); }
  .w-table .rowwrap { display: contents; }
  .chip { display: inline-block; font-family: var(--mono); font-size: 11.5px; padding: 0 6px; border-radius: 4px; background: #2b3040; margin: 1px 0; white-space: nowrap; }
  .chip-a { background: #22324d; color: #9cc4ff; } .chip-b { background: #33284a; color: #d3b0ff; }
  .chip-c { background: #3d3220; color: #ffd08a; } .chip-d { background: #1f3a2b; color: #8fe0ad; }
  .chip-x { background: #23262f; color: #6b7389; text-decoration: line-through; }
  .w-flow { display: flex; flex-direction: column; gap: 0; }
  .fnode { background: #252935; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-family: var(--mono); font-size: 12px; }
  .fnode small { display: block; font-family: -apple-system, sans-serif; font-size: 11.5px; color: var(--dim); margin-top: 1px; }
  .fnode.tone-hot { border-color: var(--amber); } .fnode.tone-err { border-color: var(--red); background: #2c1f24; }
  .fnode.tone-ok { border-color: var(--green); } .fnode.tone-key { border-color: var(--blue); color: var(--blue); }
  .farrow { color: var(--dim); font-size: 13px; padding: 1px 0 1px 14px; }
  .fbranch { display: flex; align-items: center; gap: 6px; margin: 4px 0 2px 26px; }
  .fbranch .farrow { padding: 0; }
  .w-snippet { font-family: var(--mono); font-size: 11.5px; line-height: 1.55; background: #13151c; border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; white-space: pre; overflow-x: auto; }
  .w-snippet .ln-add { background: rgba(95,211,138,.15); display: block; } .w-snippet .ln-del { background: rgba(240,122,122,.15); display: block; text-decoration: line-through; }
  .w-snippet .ln-dim { color: var(--dim); }
  .w-snippet.wrap { white-space: pre-wrap; word-break: break-word; }
  .w-snippet .ln-warn { color: var(--amber); }
  .w [data-hl].lit { box-shadow: 0 0 0 1px var(--blue); }
  .kfplay { float: right; font: 11px -apple-system, sans-serif; color: var(--blue); background: none; border: 1px solid var(--line);
    border-radius: 4px; padding: 0 6px; cursor: pointer; text-transform: none; letter-spacing: 0; }
  .w-seq { position: relative; display: grid; row-gap: 3px; }
  .w-seq .lanes { position: absolute; inset: 0; display: grid; pointer-events: none; }
  .w-seq .lanes i { justify-self: center; width: 0; border-left: 1px dashed #3a4050; margin-top: 22px; }
  .w-seq .actor { justify-self: center; font-family: var(--mono); font-size: 11.5px; font-weight: 600; padding: 2px 8px;
    border: 1px solid var(--line); border-radius: 5px; background: #252935; position: relative; z-index: 1; }
  .w-seq .msg { position: relative; z-index: 1; padding-top: 1px; }
  .w-seq .msg .lbl { text-align: center; font-size: 11.5px; line-height: 1.35; white-space: nowrap; }
  .w-seq .msg .lbl b { font-family: var(--mono); font-weight: 600; }
  .w-seq .msg .ln { height: 0; border-top: 1.5px solid #8a93a8; position: relative; margin-top: 2px; }
  .w-seq .msg .ln::after { content: ''; position: absolute; top: -5px; border: 4.5px solid transparent; }
  .w-seq .msg.r .ln::after { right: -2px; border-left: 7px solid #8a93a8; border-right: 0; }
  .w-seq .msg.l .ln::after { left: -2px; border-right: 7px solid #8a93a8; border-left: 0; }
  .w-seq .msg.dashed .ln { border-top-style: dashed; }
  .w-seq .msg.tone-err .ln { border-top-color: var(--red); } .w-seq .msg.tone-err.r .ln::after { border-left-color: var(--red); }
  .w-seq .msg.tone-err.l .ln::after { border-right-color: var(--red); }
  .w-seq .msg.tone-ok .ln { border-top-color: var(--green); } .w-seq .msg.tone-ok.r .ln::after { border-left-color: var(--green); }
  .w-seq .msg.tone-ok.l .ln::after { border-right-color: var(--green); }
  .w-seq .msg.tone-dim { opacity: .45; }
  .w-seq .msg .sub { text-align: center; font-size: 10.5px; line-height: 1.3; color: var(--dim); margin-top: 1px; }
  .w-seq .msg.tone-err .sub { color: var(--red); }
  .w-seq .snote { position: relative; z-index: 1; justify-self: center; font-size: 11px; line-height: 1.35; padding: 2px 7px; border-radius: 5px;
    background: #2b2f3c; border: 1px solid var(--line); text-align: center; max-width: 100%; }
  .w-seq .snote.tone-err { border-color: var(--red); background: #2c1f24; } .w-seq .snote.tone-hot { border-color: var(--amber); }
  .w-seq .snote.tone-ok { border-color: var(--green); }
  .w-seq .div { position: relative; z-index: 1; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--dim);
    border-top: 1px solid var(--line); padding-top: 3px; margin-top: 4px; background: var(--panel2); }
  .w-seq-legend { font-size: 11px; color: var(--dim); margin-bottom: 6px; }

  /* ================= stat ================= */
  .term .cmd { height: 38px; display: flex; align-items: center; padding: 0 16px; font-family: var(--mono); font-size: 13px;
    background: var(--panel2); border-bottom: 1px solid var(--line); }
  .term .cmd .pr { color: var(--green); margin-right: 8px; }
  .cursor { display: inline-block; width: 8px; height: 15px; background: var(--fg); margin-left: 2px; vertical-align: -2px; }
  .srow { height: 18px; display: grid; grid-template-columns: 1fr 52px 52px 260px; gap: 10px; padding: 0 16px;
    font-family: var(--mono); font-size: 12px; line-height: 18px; border-radius: 4px; }
  .srow .sp .dir { color: var(--dim); } .srow .add { color: var(--green); text-align: right; } .srow .del { color: var(--red); text-align: right; }
  .srow .bar { display: flex; align-items: center; }
  .srow .bar i { display: block; height: 8px; transform-origin: left center; }
  .srow .bar .a { background: var(--green); border-radius: 2px 0 0 2px; } .srow .bar .d { background: var(--red); border-radius: 0 2px 2px 0; }
  .srow.test .sp .base { color: #b9a6e0; }
  .slist { padding-top: 8px; }
  .totals { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--dim); }

  /* ================= summary ================= */
  .tests { position: absolute; left: 56px; top: 112px; width: 520px; }
  .tests .t { font-family: var(--mono); font-size: 13px; padding: 7px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  .tests .t .ok { color: var(--green); font-weight: 800; display: inline-block; }
  .items { position: absolute; left: 600px; top: 112px; width: 624px; display: flex; flex-direction: column; gap: 14px; }
  .item { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--amber); border-radius: 10px; padding: 14px 16px; }
  .item.nit { border-left-color: var(--dim); }
  .item .ref { font-family: var(--mono); font-size: 12px; margin-bottom: 6px; display: block; }
  .item .txt { font-size: 16px; }
  .card-title { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: var(--dim); padding: 12px 14px 8px; }

  /* ================= tour chrome ================= */
  #caption { position: absolute; left: 80px; right: 80px; bottom: 84px; min-height: 48px; color: #cfd3dc; font-size: 17px; text-align: center; }
  #controls { position: absolute; left: 40px; right: 40px; bottom: 16px; height: 52px; display: flex; align-items: center; gap: 14px; }
  button.ctl { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
    height: 34px; min-width: 40px; padding: 0 12px; font-size: 14px; cursor: pointer; font-family: inherit; }
  button.ctl:hover { border-color: var(--blue); }
  button.ctl.on { border-color: var(--blue); color: var(--blue); }
  #time { font-family: var(--mono); font-size: 13px; color: var(--dim); width: 96px; text-align: center; }
  #speed { width: 64px; font-family: var(--mono) !important; }
  #bar { position: relative; flex: 1; height: 34px; cursor: pointer; touch-action: none; }
  #track { position: absolute; left: 0; right: 0; top: 20px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); width: 0; }
  #knob { position: absolute; top: 15px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(110,170,255,.35); }
  .chapter { position: absolute; top: 0; height: 18px; font-size: 10.5px; color: var(--dim); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; padding-left: 5px; border-left: 1px solid var(--line); }
  .chapter.cur { color: var(--fg); }
  .tick { position: absolute; top: 18px; width: 2px; height: 10px; background: var(--bg); }
  #start { position: absolute; inset: 0 0 80px 0; display: grid; place-items: center; background: rgba(10,12,16,.55); z-index: 5; cursor: pointer; }
  #start .go { background: var(--blue); color: #0b1020; font-weight: 700; font-size: 22px; padding: 16px 34px; border-radius: 40px; }
  #start .alt { margin-top: 14px; font-size: 14px; color: var(--dim); text-align: center; }
  #start .alt a { cursor: pointer; }
  #silent { position: absolute; right: 56px; top: 34px; font-size: 11px; color: var(--amber); border: 1px solid var(--amber); border-radius: 5px; padding: 1px 6px; }

  /* ================= read (scrolling document) ================= */
  /* --barh and --navh are the heights of the sticky title bar and section nav, set from script */
  :root { --top: calc(var(--barh, 52px) + var(--navh, 0px)); }
  #read { max-width: 1320px; margin: 0 auto; padding: 0 28px 120px; font-size: 15px; }
  #rbar { position: sticky; top: 0; z-index: 10; background: rgba(15,17,22,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
    margin: 0 -28px; padding: 10px 28px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #rbar .ttl { font-weight: 650; margin-right: auto; font-size: 15px; }
  #rbar .ttl small { color: var(--dim); font-weight: 400; margin-left: 8px; }
  #read h2 { font-size: 22px; margin: 0; letter-spacing: -.2px; }
  .rsec { padding: 30px 0 8px; border-bottom: 1px solid var(--line); scroll-margin-top: var(--top); }
  #read .row.rfold { cursor: pointer; color: var(--dim); font-family: -apple-system, sans-serif; font-size: 12px; }
  #read .row.rfold:hover { color: var(--blue); }
  #read .rfolded { display: none; }
  #layout-errors { position: absolute; left: 0; right: 0; top: 0; z-index: 9; background: #7a1f1f; color: #fff; font: 12px var(--mono); padding: 4px 10px; }
  .rsec .rhead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .rsec .rhead .kicker { margin: 0; }
  .rsec .rhead button { margin-left: auto; }
  .rgrid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
  .rgrid.wide { grid-template-columns: minmax(0, 1fr) 520px; }
  .rgrid.solo { grid-template-columns: minmax(0, 1fr); }
  .rcode { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  #read .row { height: auto; }
  .rsteps { display: flex; flex-direction: column; gap: 10px; position: sticky; top: calc(var(--top) + 12px); }
  .rstep { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 8px; }
  .rstep .say { color: #c5cad6; font-size: 14px; line-height: 1.5; }
  .rstep:hover { border-left-color: var(--blue); }
  .rstep:hover .say { color: var(--fg); }
  #read .row.hot { box-shadow: inset 3px 0 0 0 var(--blue); background-color: rgba(110,170,255,.10); }
  #read .row.hot .gut { background: #1d2433; }
  .rstat .srow { height: 20px; line-height: 20px; }
  .rest details { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin: 10px 0; overflow: hidden; }
  .rest summary { cursor: pointer; padding: 8px 14px; font-family: var(--mono); font-size: 12.5px; }
  .rest summary .cnt { color: var(--dim); margin-left: 8px; }
  body:not(.raw-diff) .rows.raw, body.raw-diff .rows.struct { display: none; }

  /* read mode: Go-aware renderings placed by views.py; the tour shows the same rows without them */
  mark.xref { background: none; color: inherit; }
  #read .rows.single .gut { grid-template-columns: 40px 18px; }
  #read .rows.single .gut .ln:first-child { display: none; }
  #read .rows mark.xref { color: var(--blue); text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }
  #read .rows mark.xref.open { background: rgba(110,170,255,.18); border-radius: 3px; text-decoration-style: solid; }
  #read .rows mark.xref.plain, #read .rows.raw mark.xref { color: inherit; text-decoration: none; cursor: default; }
  mark.peek { background: none; color: inherit; }
  #read .rows mark.peek:not(.plain) { text-decoration: underline dotted rgba(139,146,163,.55); text-underline-offset: 3px; cursor: help; }
  #read .rows mark.peek:not(.plain):hover { color: var(--blue); text-decoration-color: var(--blue); }
  #popover { position: fixed; z-index: 60; display: none; width: min(640px, calc(100vw - 24px)); max-height: 62vh; overflow: auto;
    border-radius: 10px; box-shadow: 0 10px 34px rgba(0,0,0,.55); }
  .pcard { background: #1b1f2a; border: 1px solid #39405a; border-radius: 10px; overflow: hidden; }
  .phead { display: flex; gap: 8px; align-items: baseline; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .phead .pkind { font: 10.5px var(--mono); color: var(--violet); }
  .phead b { font: 600 13px var(--mono); }
  .phead a { margin-left: auto; color: var(--dim); font: 11px var(--mono); }
  .phead .px { background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 16px; line-height: 1; padding: 0 2px; }
  .phead .px:hover { color: var(--fg); }
  .pmore { color: var(--dim); font-size: 12px; padding: 6px 12px; }
  #peekdock { position: fixed; right: 14px; top: calc(var(--top) + 10px); bottom: 14px; width: 520px; overflow: auto;
    display: flex; flex-direction: column; gap: 10px; z-index: 40; pointer-events: none; }
  #peekdock > * { pointer-events: auto; flex: none; }
  .snav { position: sticky; top: var(--barh, 52px); z-index: 9; display: flex; gap: 6px; margin: 0 -28px; padding: 10px 28px 9px;
    background: rgba(15,17,22,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }

  .frel { padding: 5px 14px; font-size: 12px; color: var(--dim); border-bottom: 1px solid var(--line); background: #171a22; }
  .frel a { font: 11.5px var(--mono); cursor: pointer; margin: 0 4px; }

    border: 1px solid var(--line); border-radius: 10px; padding: 6px 0; background: var(--panel); }

    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }

  .ann { font-family: -apple-system, sans-serif; font-size: 10.5px; margin-left: 14px; }

  .b-opt { background: #3d3220; color: #ffd08a; } .b-list { background: #22324d; color: #9cc4ff; } .b-map { background: #33284a; color: #d3b0ff; }
  .b-ptr { background: #2b3040; color: var(--dim); } .b-val { background: #3d3220; color: #ffd08a; font-family: var(--mono); }
  .tblock { padding: 2px 0 6px; }

  .row.gap .cd { color: #4d5466; font: 11px var(--mono); }
  #read .row.tbar { cursor: pointer; color: var(--blue); font-family: -apple-system, sans-serif; font-size: 12px; }
  #read .row.tbar .sg { color: var(--blue); }

  .inl.off { display: none; }
  .ttable { border-collapse: collapse; width: 100%; max-width: 1100px; font-size: 13px; background: #13161d; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .ttable th { text-align: left; color: var(--dim); font: 500 12px var(--mono); padding: 7px 12px; border-bottom: 1px solid var(--line); }

  .ttable tr.added td.num { box-shadow: inset 3px 0 0 var(--green); } .ttable tr.changed td.num { box-shadow: inset 3px 0 0 var(--amber); }
  .ttable tr:hover td { background: rgba(110,170,255,.05); }
  .ttable tr.hot td { background: rgba(110,170,255,.12); }
  #read .row.hp { cursor: pointer; }
  .row.hp .sg { color: var(--violet); }
  .row.hp .cd .dim { opacity: .5; }
  .row.hp:hover .cd .dim { opacity: .9; }
  .hpopen { cursor: pointer; }
  .hpopen .gut { box-shadow: inset 2px 0 0 var(--violet); }
  .hpopen:hover { background: rgba(195,140,255,.07); }
  .hpopen:hover .gut { box-shadow: inset 4px 0 0 var(--violet); }
  #tip { position: fixed; z-index: 50; display: none; max-width: 380px; padding: 7px 10px; border-radius: 8px; pointer-events: none;
    background: #232734; border: 1px solid #39405a; box-shadow: 0 6px 24px rgba(0,0,0,.45); color: var(--fg); font: 13px/1.4 -apple-system, sans-serif; }
  #tip small { display: block; margin-bottom: 2px; color: var(--dim); font: 11px var(--mono); }
</style>
</head>
<body class="mode-tour">
<div id="tour"><div id="stage">
  <div id="glow"></div>
  <div id="scenes"></div>
  <div id="caption"></div>
  <div id="controls">
    <button class="ctl" id="play" title="Play / pause (space)">▶</button>
    <div id="time">0:00 / 0:00</div>
    <div id="bar"><div id="track"><div id="fill"></div></div><div id="knob"></div></div>
    <button class="ctl" id="speed" title="Playback speed ( - / = )">1×</button>
    <button class="ctl" id="toRead" title="Read this part as a document (r)">Read</button>
  </div>
  <div id="start"><div><div class="go">▶ Play walkthrough</div><div class="alt">or <a id="startRead">read it as a document</a></div></div></div>
</div></div>

<div id="read">
  <div id="rbar">
    <span class="ttl" id="rtitle"></span>
    <button class="ctl" id="playTour">▶ Play tour</button>
    <button class="ctl on" id="tStruct" title="Hide whitespace-only changes and mark changed tokens (difftastic)">Structural diff</button>
  </div>
  <div id="rbody"></div>
</div>

<script>
const DATA = /*DATA*/null;
const D = DATA.duration, SC = DATA.scenes, META = DATA.meta;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const LH = 21, HHEAD = 32, HGAP = 14, PANE_H = 452;
const SIDE_MAX = 470;  // side column top (112) to just above the caption (588)
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const splitPath = p => { const i = p.lastIndexOf('/'); return `<span class="path"><span class="dir">${esc(p.slice(0, i + 1))}</span><span class="base">${esc(p.slice(i + 1))}</span></span>`; };
// Ticket keys from the spec's Jira projects and #N references to this repo's PRs become links.
const JIRA = META.jira?.projects?.length ? new RegExp(`\\b(?:${META.jira.projects.join('|')})-\\d+\\b`, 'g') : null;
// Titles fetched at build time show in a hover card (see the #tip handlers at the end).
const REFS = META.refs || {};
const link = (href, text, key) => {
  const r = REFS[key];
  const tip = r ? ` data-tip="${esc(r.title)}" data-tip-meta="${esc(key + (r.state ? ' · ' + r.state : ''))}"` : '';
  return `<a href="${esc(href)}" target="_blank" rel="noopener"${tip}>${text}</a>`;
};
const linkify = html => {
  if (JIRA) html = html.replace(JIRA, k => link(`${META.jira.site}/browse/${k}`, k, k));
  return html.replace(/(^|[^&\w])#(\d+)\b/g, (_, pre, n) => pre + link(`https://github.com/${META.github}/pull/${n}`, '#' + n, '#' + n));
};
// Inline markup for note, widget, step and item text: `code`, **bold**, ~~strike~~, {a:chip}.
const md = s => linkify(esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
  .replace(/~~([^~]+)~~/g, '<s>$1</s>').replace(/\{([a-z]):([^}]+)\}/g, '<span class="chip chip-$1">$2</span>'));
const refLink = r => r ? `<a class="ref" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a>` : '';
document.title = META.title;

// ================= timeline engine: paused WAAPI animations driven by the clock =================
const EASE = 'cubic-bezier(.22,.9,.25,1)';
const groups = SC.map(() => []), globalTracks = [], customs = [];
let curGroup = globalTracks;
function track(target, frames) {
  frames = frames.slice().sort((a, b) => a[0] - b[0]);
  const t0 = frames[0][0], dur = Math.max(frames.at(-1)[0] - t0, 0.001);
  const anim = target.animate(frames.map(([t, k]) => ({ easing: EASE, ...k, offset: (t - t0) / dur })), { duration: dur * 1000, fill: 'both' });
  anim.pause();
  curGroup.push({ anim, t0, dur });
}
const custom = (t0, dur, fn) => customs.push({ t0, dur, fn });
const rise = (e, t, dy = 14, d = .5) => track(e, [[t, { opacity: 0, transform: `translateY(${dy}px)` }], [t + d, { opacity: 1, transform: 'translateY(0px)' }]]);
const grow = (e, t, d = .5) => track(e, [[t, { transform: 'scaleX(0)' }], [t + d, { transform: 'scaleX(1)' }]]);
function onPanel(rgb, a) { const base = [22, 25, 33]; return `rgb(${base.map((b, i) => Math.round(b + (rgb[i] - b) * a)).join(',')})`; }

// ================= code rows (shared by both modes) =================
const KIND = { '+': 'add', '-': 'del', ' ': 'ctx', '~': 'cos', '±': 'mod' };
const SIGN = { '+': '+', '-': '−', ' ': '', '~': '≈', '±': '±' };
function rowEl(r, isNew) {
  const cls = KIND[r.k] + (r.k === '+' && isNew ? ' newfile' : '');
  const row = el('div', 'row ' + cls);
  const gut = el('span', 'gut');
  gut.append(el('span', 'ln', r.o ?? ''), el('span', 'ln', r.n ?? ''), el('span', 'sg', SIGN[r.k]));
  row.append(gut, el('span', 'cd', r.h || ' '));
  if (r.k === '-') row.appendChild(el('i', 'strike'));
  return row;
}
function hunkHead(h) {
  const isNew = h.isNew;
  return el('div', 'hhead', `<a href="${esc(h.url)}" target="_blank" rel="noopener">${splitPath(h.file)}</a>${isNew ? '<span class="newf">new file</span>' : ''}<span class="rng">${h.range}</span>`);
}

// ================= widgets =================
// Each returns an element. Children with data-step="k" appear at step k; data-hl="k" lights up at step k. data-row is
// the index of the spec row a child draws.
const W = {
  table(w) {
    const e = el('div', 'w');
    if (w.title) e.appendChild(el('div', 'w-title', esc(w.title)));
    const g = el('div', 'w-table');
    g.style.gridTemplateColumns = w.widths || `repeat(${w.columns.length}, auto)`;
    w.columns.forEach(c => g.appendChild(el('span', 'h', esc(c))));
    w.rows.forEach((r, ri) => {
      const row = Array.isArray(r) ? { cells: r } : r;
      const wrap = el('div', 'rowwrap');
      row.cells.forEach((c, i) => {
        const m = /^(ok|bad|warn|dim):\s*/.exec(c);
        const cell = el('span', 'c' + (w.mono?.includes(i) ? ' mono' : '') + (m ? ' tone-' + m[1] : '') + (row.tone ? ' tone-' + row.tone : ''), md(m ? c.slice(m[0].length) : c));
        cell.dataset.row = ri;
        if (row.step != null) cell.dataset.step = row.step;
        if (row.hl != null) cell.dataset.hl = row.hl;
        wrap.appendChild(cell);
      });
      g.appendChild(wrap);
    });
    e.appendChild(g);
    return e;
  },
  flow(w) {
    const e = el('div', 'w');
    if (w.title) e.appendChild(el('div', 'w-title', esc(w.title)));
    const f = el('div', 'w-flow');
    w.nodes.forEach((n, i) => {
      const step = n.step ?? 0;
      if (i) { const a = el('div', 'farrow', '↓'); a.dataset.step = step; f.appendChild(a); }
      const node = el('div', 'fnode' + (n.tone ? ' tone-' + n.tone : ''), `${md(n.label)}${n.sub ? `<small>${md(n.sub)}</small>` : ''}`);
      node.dataset.row = i;
      node.dataset.step = step;
      if (n.hl != null) node.dataset.hl = n.hl;
      f.appendChild(node);
      if (n.branch) {
        const b = el('div', 'fbranch');
        b.dataset.step = n.branch.step ?? step;
        b.append(el('span', 'farrow', '↳'), el('div', 'fnode' + (n.branch.tone ? ' tone-' + n.branch.tone : ''),
          `${md(n.branch.label)}${n.branch.sub ? `<small>${md(n.branch.sub)}</small>` : ''}`));
        f.appendChild(b);
      }
    });
    e.appendChild(f);
    return e;
  },
  snippet(w) {
    const e = el('div', 'w');
    if (w.title) e.appendChild(el('div', 'w-title', esc(w.title)));
    const pre = el('div', 'w-snippet' + (w.wrap ? ' wrap' : ''));
    w.lines.forEach((l, i) => {
      const line = typeof l === 'string' ? { text: l } : l;
      const s = el('span', line.tone ? 'ln-' + line.tone : '', esc(line.text) + (line.tone === 'add' || line.tone === 'del' ? '' : '\n'));
      s.dataset.row = i;
      if (line.step != null) s.dataset.step = line.step;
      pre.appendChild(s);
    });
    e.appendChild(pre);
    return e;
  },
  sequence(w) {
    const e = el('div', 'w');
    if (w.title) e.appendChild(el('div', 'w-title', esc(w.title)));
    if (w.legend) e.appendChild(el('div', 'w-seq-legend', md(w.legend)));
    const n = w.actors.length, cols = `repeat(${n}, 1fr)`, col = a => {
      const i = w.actors.indexOf(a);
      if (i < 0) throw new Error(`sequence ${w.title || ''}: unknown actor ${a}`);
      return i;
    };
    const g = el('div', 'w-seq');
    g.style.gridTemplateColumns = cols;
    const lanes = el('div', 'lanes');
    lanes.style.gridTemplateColumns = cols;
    w.actors.forEach(a => { g.appendChild(el('div', 'actor', esc(a))); lanes.appendChild(el('i')); });
    g.appendChild(lanes);
    w.rows.forEach((r, i) => {
      let c;
      if (r.divider != null) {
        c = el('div', 'div', md(r.divider));
        c.style.gridColumn = '1 / -1';
      } else if (r.note != null) {
        const at = [].concat(r.at).map(col);
        c = el('div', 'snote' + (r.tone ? ' tone-' + r.tone : ''), md(r.note));
        c.style.gridColumn = `${Math.min(...at) + 1} / ${Math.max(...at) + 2}`;
      } else {
        const a = col(r.from), b = col(r.to), span = Math.abs(b - a) + 1;
        c = el('div', 'msg ' + (b > a ? 'r' : 'l') + (r.tone ? ' tone-' + r.tone : '') + (r.dashed ? ' dashed' : ''),
          `<div class="lbl"><b>${esc(r.label)}</b>${r.tag ? ' ' + md(r.tag) : ''}</div><div class="ln"></div>${r.sub ? `<div class="sub">${md(r.sub)}</div>` : ''}`);
        c.style.gridColumn = `${Math.min(a, b) + 1} / span ${span}`;
        c.style.margin = `0 calc(100% / ${2 * span})`;
      }
      c.dataset.row = i;
      if (r.step != null) c.dataset.step = r.step;
      if (r.hl != null) c.dataset.hl = r.hl;
      g.appendChild(c);
    });
    e.appendChild(g);
    return e;
  },
  html(w) { const e = el('div', 'w', (w.title ? `<div class="w-title">${esc(w.title)}</div>` : '') + w.html); return e; },
};
function animateWidget(e, ts) {
  const at = k => ts[Math.min(k, ts.length - 1)] ?? ts[0];
  $$('[data-step]', e).forEach(c => { const k = +c.dataset.step; if (k > 0) rise(c, at(k) + .1, 6, .4); });
  $$('[data-hl]', e).forEach(c => {
    const t = at(+c.dataset.hl);
    track(c, [[t, { boxShadow: '0 0 0 0 rgba(110,170,255,0)' }], [t + .3, { boxShadow: '0 0 0 2px rgba(110,170,255,.9)' }]]);
  });
  $$('[data-kf]', e).forEach(c => track(c, kfFrames(c, at)));
}
// data-kf on an html widget part: JSON [[step, seconds after that step, {css}], ...], for motion such as a message
// travelling along a link. Every frame should name every property it animates.
const kfFrames = (c, at) => JSON.parse(c.dataset.kf).map(([k, dt, css]) => [at(k) + dt, css]);
// Read mode has no clock, so a widget with data-kf parts gets a button that plays them in real time, each step
// starting once the previous one's frames end. The parts rest on their last frame.
function kfReplay(w) {
  const parts = $$('[data-kf]', w);
  if (!parts.length) return;
  const len = [];
  parts.forEach(c => JSON.parse(c.dataset.kf).forEach(([k, dt]) => { len[k] = Math.max(len[k] ?? 0, dt + .6); }));
  const start = [0];
  for (let k = 1; k < len.length; k++) start[k] = start[k - 1] + (len[k - 1] ?? 0);
  const anims = parts.map(c => {
    const f = kfFrames(c, k => start[k]), t0 = f[0][0], dur = Math.max(f.at(-1)[0] - t0, .001);
    const a = c.animate(f.map(([t, css]) => ({ easing: EASE, ...css, offset: (t - t0) / dur })), { duration: dur * 1000, delay: t0 * 1000, fill: 'both' });
    a.finish();
    return a;
  });
  const b = el('button', 'kfplay', '▶ play');
  b.onclick = () => anims.forEach(a => { a.currentTime = 0; a.play(); });
  (w.querySelector('.w-title') ?? w).prepend(b);
}

// ================= tour: code scenes =================
function buildCode(scene, root) {
  const S = scene.start, hasSide = scene.actions.some(a => a.type === 'note' || a.type === 'widget');
  const pane = el('div', 'pane' + (hasSide ? (scene.side === 'wide' ? ' narrow' : '') : ' wide')), scroll = el('div', 'scroll');
  pane.appendChild(scroll); root.appendChild(pane);
  const morphAt = scene.hunks.map((h, i) => {
    const a = scene.actions.find(a => a.type === 'morph' && a.hunk === i);
    return a ? a.t : (h.mode === 'diff' ? null : S + .5 + i * .2);
  });
  const rowEls = [], model = [];
  scene.hunks.forEach((h, hi) => {
    const hunk = el('div', 'hunk');
    hunk.appendChild(hunkHead(h));
    let nDel = 0, nAdd = 0;
    rowEls[hi] = [];
    const body = el('div', 'hbody'), rowsEl = el('div', 'rows');
    body.appendChild(rowsEl); hunk.appendChild(body);
    h.rows.forEach((r, ri) => {
      const row = rowEl(r, h.isNew);
      rowsEl.appendChild(row);
      rowEls[hi][ri] = row;
      const m = morphAt[hi];
      let addT = null;
      if (m !== null && r.k === '+') addT = m + (h.mode === 'type' ? ri * .045 : .55 + nAdd++ * .07);
      if (m !== null && r.k === '-') {
        const dT = m + nDel++ * .04, gut = $('.gut', row);
        const tint = a => ({ backgroundColor: `rgba(240,122,122,${a})` });
        track(row, [[dT, tint(0)], [dT + .12, tint(.35)], [dT + .5, tint(.11)]]);
        track(gut, [[dT, { backgroundColor: onPanel([240, 122, 122], 0) }], [dT + .12, { backgroundColor: onPanel([240, 122, 122], .35) }],
          [dT + .5, { backgroundColor: onPanel([240, 122, 122], .11) }]]);
        track($('.sg', row), [[dT, { color: 'rgba(240,122,122,0)' }], [dT + .2, { color: 'rgba(240,122,122,1)' }]]);
        grow($('.strike', row), dT + .1, .35);
        track($('.cd', row), [[dT, { filter: 'brightness(1)' }], [dT + .4, { filter: 'brightness(.6)' }]]);
      }
      if (m !== null && r.k === '±') {
        const mT = m + .55 + nAdd++ * .07;
        $$('mark.x-ins', row).forEach(mk => track(mk, [[mT, { backgroundColor: 'rgba(95,211,138,0)' }], [mT + .2, { backgroundColor: 'rgba(95,211,138,.6)' }], [mT + .9, { backgroundColor: 'rgba(95,211,138,.28)' }]]));
      }
      if (addT !== null) {
        const flash = h.mode === 'type' ? .22 : .35, rest = h.isNew ? .045 : .11, g = [95, 211, 138], gut = $('.gut', row);
        track(row, [[addT, { height: '0px', backgroundColor: `rgba(95,211,138,${flash})` }], [addT + .28, { height: LH + 'px', backgroundColor: `rgba(95,211,138,${flash})` }],
          [addT + .9, { height: LH + 'px', backgroundColor: `rgba(95,211,138,${rest})` }]]);
        track(gut, [[addT, { backgroundColor: onPanel(g, flash) }], [addT + .28, { backgroundColor: onPanel(g, flash) }], [addT + .9, { backgroundColor: onPanel(g, rest) }]]);
      }
      model.push({ hi, ri, addT });
    });
    scroll.appendChild(hunk);
  });

  function layoutAt(t) {
    const tops = {}; let y = 0;
    scene.hunks.forEach((h, hi) => {
      y += HHEAD;
      h.rows.forEach((r, ri) => {

function sharedPrefixes(cells) {
  const flat = cells.map(c => c && c.str == null ? flatOf(c) : null);
  return flat.map((a, i) => {
    if (a == null) return 0;
    const shared = flat.map((b, j) => {
      if (j === i || b == null) return 0;
      let k = 0;
      while (k < a.length && k < b.length && a[k] === b[k]) k++;
      return k;
    }).sort((x, y) => y - x);
    const best = shared[PREFIX_ROWS - 2] || 0;
    const cut = Math.max(...['(', '`', ' ', '>', ','].map(ch => a.lastIndexOf(ch, best - 1) + 1));
    return cut >= PREFIX_MIN && a.length - cut >= REST_MIN ? cut : 0;
  });
}
function testCell(c, col, prefix) {
  if (!c) return el('td', 'empty', '—');
  if (c.str != null && !c.multiline) {
    if (c.str === '') return el('td', 'empty', '""');
    return el('td', col === 'name' || col === 'desc' ? '' : 'str', esc(c.str));
  }
  const td = el('td', 'code');
  // A struct literal with a short form (only the fields where it departs from the column's usual) shows that instead.
  const toks = c.diff || c.toks;
  if (c.diff) prefix = 0;
  const flat = toks.map(t => t[1]).join('');
  const pre = prefix ? `<span class="pre" title="${esc(flat.slice(0, prefix))}">…</span>` : '';
  const fits = flat.length - prefix <= CELL_MAX;
  if (fits && !prefix && !c.diff) { td.innerHTML = tokSlice(toks, 0); return td; }
  const short = pre + (fits ? tokSlice(toks, prefix) : tokSlice(toks, prefix, prefix + CELL_MAX - 1) + '…');
  const text = el('span', '', short);
  const more = el('span', 'more', 'more');
  more.onclick = () => {
    const open = more.textContent === 'less';
    text.innerHTML = open ? short : c.html ?? tokSlice(c.toks, 0);
    more.textContent = open ? 'more' : 'less';
  };
  td.append(text, more);
  return td;
}
function caseTable(t, key) {
  const table = el('table', 'ttable');
  const tr = el('tr');
  const columns = t.columns.filter(c => t.rows.some(r => r.cells[c]));  // a field none of these cases set gets no column
  tr.appendChild(el('th', '', ''));
  columns.forEach(c => tr.appendChild(el('th', '', esc(c))));
  table.appendChild(el('thead')).appendChild(tr);
  const tb = el('tbody');
  const prefixes = Object.fromEntries(columns.map(c => [c, sharedPrefixes(t.rows.map(r => r.cells[c]))]));
  t.rows.forEach((r, i) => {
    const row = el('tr', r.mark || '');
    row.dataset.hk = r.keys.map(key).join(' ');
    row.appendChild(el('td', 'num', i + 1));
    columns.forEach(c => row.appendChild(testCell(r.cells[c], c, prefixes[c][i])));
    tb.appendChild(row);
  });
  table.appendChild(tb);
  return table;
}
// The bar and the table, appended to the list; the case rows that follow go in block.rows, hidden behind the table.
function caseBlock(t, key, list, first) {
  const cases = t.rows.length < t.total ? `${t.rows.length} of ${t.total} cases` : `${t.rows.length} cases`;
  const bar = markRow('⊞', `${cases} as a table · show the code`, 'tbar');
  const inl = el('div', 'inl');
  inl.style.paddingLeft = `calc(${gutterWidth(list)}px + ${indentOf(first.h).replace(/\t/g, '    ').length}ch)`;
  inl.appendChild(caseTable(t, key));
  const block = { t, rows: [] };
  bar.onclick = () => {
    const code = inl.classList.toggle('off');
    block.rows.forEach(x => x.style.display = code ? '' : 'none');
    $('.cd', bar).textContent = code ? `${cases} as code · show as a table` : `${cases} as a table · show the code`;
  };
  list.append(bar, inl);
  return block;
}
const indentOf = html => (el('span', '', html).textContent.match(/^\s*/) || [''])[0];

// Error handling folded to one line of its real code. The fold row stands for the block's rows; the block they go in
// replaces it when opened and folds back when clicked. A block a narration step points at wholly starts open.
function errorFold(f, r, key, focusSets, list, isNew, group) {
  const row = el('div', `row ${f.k === '+' ? 'add' + (isNew ? ' newfile' : '') : 'ctx'} hp`);
  const gut = el('span', 'gut');
  gut.append(el('span', 'ln', r.o ?? ''), el('span', 'ln', r.n ?? ''), el('span', 'sg', '⤷'));
  row.append(gut, el('span', 'cd', f.html));
  row.dataset.hk = span(f.a, f.b).map(key).join(' ');
  row.title = `${f.b - f.a + 1} lines of error handling; click to open`;
  if (group) { row.classList.add('rfolded'); row.dataset.fold = group; }
  const full = el('div', 'hpopen');
  full.title = 'click to fold the error handling again';
  const open = focusSets.some(s => s.every(i => i >= f.a && i <= f.b));
  (open ? row : full).style.display = 'none';
  row.onclick = () => { row.style.display = 'none'; full.style.display = ''; };
  full.onclick = e => {
    if (e.target.closest('.tnest, mark.xref:not(.plain), a')) return;
    full.style.display = 'none';
    row.style.display = '';
  };
  list.append(row, full);
  return full;
}

function readHunk(h, si, hi) {
  const box = el('div', 'hunk');
  box.appendChild(hunkHead(h));
  const body = el('div', 'hbody');
  const key = ri => `${si}:${hi}:${ri}`;
  const focusSets = si == null ? [] : SC[si].actions.filter(a => a.type === 'focus')
    .map(a => a.rows.filter(([H]) => H === hi).map(([, r]) => r)).filter(s => s.length);
  const focused = new Set(focusSets.flat());
  const tables = h.tables || [], inTable = new Set(tables.flatMap(t => span(t.a, t.b)));
  for (const [rows, cls] of [[h.rows, 'struct'], [h.raw || h.rows, 'raw']]) {
    const struct = cls === 'struct';
    const list = el('div', `rows ${cls}${rows.every(r => r.o == null) ? ' single' : ''}`);
    const plan = struct ? foldPlan(rows, focused, inTable) : rows.map(() => null);
    // An error fold needs the narration fold to leave its rows all shown or all hidden.
    const folds = struct ? (h.folds || []).filter(f => span(f.a, f.b).every(i => plan[i]?.start === plan[f.a]?.start)) : [];
    let group = null, holder = list, fold = null, table = null;
    rows.forEach((r, ri) => {
      const p = plan[ri];
      if (p && p.start === ri) { group = 'f' + foldSeq++; list.appendChild(narrationFold(group, p.n)); }
      const t = struct && tables.find(t => t.a === ri);
      if (t) table = caseBlock(t, key, list, r);
      const f = folds.find(f => f.a === ri);
      if (f) { fold = f; holder = errorFold(f, r, key, focusSets, list, h.isNew, p && group); }
      const row = struct ? richRow(r, h.isNew, new Set()) : rowEl(r, h.isNew);
      if (struct && si != null) row.dataset.key = key(ri);
      if (p) { row.classList.add('rfolded'); row.dataset.fold = group; }
      if (table) { row.style.display = 'none'; table.rows.push(row); }
      holder.appendChild(row);
      if (table && ri === table.t.b) table = null;
      if (fold && ri === fold.b) { fold = null; holder = list; }
    });
    body.appendChild(list);
  }
  box.appendChild(body);
  return box;
}
// Lights a step's rows, and whatever stands in for rows that are hidden: an error fold, or a table row.
function hotRows(si, rows, on) {
  (rows || []).forEach(([h, r]) => {
    const k = `${si}:${h}:${r}`;
    $$(`#read [data-key="${k}"], #read [data-hk~="${k}"]`).forEach(x => x.classList.toggle('hot', on));
  });
}
function readSection(scene, si) {
  const sec = el('section', 'rsec');
  sec.id = 'sec-' + si;
  const head = el('div', 'rhead', `<span class="kicker">${esc(scene.chapter)}</span><h2>${linkify(esc(scene.title))}</h2>`);
  const play = el('button', 'ctl', '▶ from here');
  play.onclick = () => { setMode('tour'); seek(scene.start + .01); if (audio.paused) toggle(); };
  head.appendChild(play);
  sec.appendChild(head);
  if (scene.kind === 'stat') {
    const box = el('div', 'rcode rstat term');
    box.appendChild(el('div', 'cmd', `<span class="pr">$</span>${esc(META.statCommand)}<span class="totals">${totals()}</span>`));
    const list = el('div', 'slist'); statRows(list, null); box.appendChild(list);
    sec.appendChild(box);
    sec.appendChild(stepsFor(scene, si));
    return sec;
  }
  if (scene.kind === 'summary') {
    const g = el('div', 'rgrid');
    const tests = el('div', 'rcode');
    tests.appendChild(el('div', 'card-title', 'TESTS'));
    (scene.tests || []).forEach(n => tests.appendChild(el('div', 'row', `<span class="cd">✓ ${esc(n)}</span>`)));
    const items = el('div', 'rsteps');
    scene.items.forEach(it => items.appendChild(itemEl(it)));
    g.append(tests, items);
    sec.appendChild(g);
    sec.appendChild(stepsFor(scene, si));
    return sec;
  }
  const g = el('div', 'rgrid' + (scene.side === 'wide' ? ' wide' : ''));
  const code = el('div', 'rcode');
  scene.hunks.forEach((h, hi) => code.appendChild(readHunk(h, si, hi)));
  g.append(code, stepsFor(scene, si));
  sec.appendChild(g);
  return sec;
}
// Each cue's rows: its own focus, else the focus before it, as in the tour.
function rowsByCue(scene) {
  let last = [];
  return scene.cues.map(c => {
    const f = scene.actions.filter(a => a.cue === c.i && a.type === 'focus').flatMap(a => a.rows);
    if (f.length) last = f;
    return last;
  });
}
// Hovering a part of a graphic (a sequence's row, a table's row, a flow node, a snippet line) lights the code it stands
// for: the part's own `code` in the spec, else the focus of the cue that brought its step in.
const PARTS = '.w-seq > [data-row], .w-table .c, .w-flow .fnode, .w-snippet > span';
const partStep = x => +(x.dataset.hl ?? x.closest('[data-step]')?.dataset.step ?? 0);
function linkWidget(e, scene, si, name, stepRows, cueRows) {
  // Over the graphic, only the hovered part's rows light, not the whole step's.
  e.onmouseenter = () => hotRows(si, stepRows, false);
  e.onmouseleave = () => hotRows(si, stepRows, true);
  const w = scene.widgets[name], list = w.rows || w.nodes || w.lines || [];
  $$(PARTS, e).forEach(x => {
    const own = list[+x.dataset.row]?.code;
    const a = own ? null : scene.actions.find(a => a.type === 'widget' && a.name === name && a.step >= partStep(x));
    const rows = own || (a ? cueRows[a.cue] : []);
    const group = x.matches('.w-table .c') ? $$(`.c[data-row="${x.dataset.row}"]`, e) : [x];
    x.onmouseenter = () => { group.forEach(p => p.classList.add('wlit')); hotRows(si, rows, true); };
    x.onmouseleave = () => { group.forEach(p => p.classList.remove('wlit')); hotRows(si, rows, false); };
  });
}
// One block per narrated cue: the caption, then any note or widget it introduces. Hovering lights its rows.
function stepsFor(scene, si) {
  const col = el('div', 'rsteps');
  const seen = new Set(), cueRows = rowsByCue(scene);
  scene.cues.forEach(c => {
    const step = el('div', 'rstep');
    step.appendChild(el('div', 'say', md(c.text)));
    const acts = scene.actions.filter(a => a.cue === c.i), made = [];
    let rows = [];
    for (const a of acts) {
      if (a.type === 'focus') rows = rows.concat(a.rows);
      if (a.type === 'note') { const n = noteEl(a); n.onmouseenter = () => hotRows(si, a.rows, true); n.onmouseleave = () => hotRows(si, a.rows, false); step.appendChild(n); }
      if (a.type === 'widget' && !seen.has(a.name)) {
        seen.add(a.name);
        const w = W[scene.widgets[a.name].kind](scene.widgets[a.name]);
        made.push([w, a.name]);
        step.appendChild(w);
        kfReplay(w);
      }
    }
    made.forEach(([w, name]) => linkWidget(w, scene, si, name, rows, cueRows));
    step.onmouseenter = () => hotRows(si, rows, true);
    step.onmouseleave = () => hotRows(si, rows, false);
    col.appendChild(step);
  });
  return col;
}
const onScroll = [];
addEventListener('scroll', () => onScroll.forEach(f => f()), { passive: true });
const watch = f => { onScroll.push(f); requestAnimationFrame(f); };
const topOffset = () => $('#rbar').offsetHeight + ($('#read .snav')?.offsetHeight || 0);
function setBarHeights() {
  document.documentElement.style.setProperty('--barh', $('#rbar').offsetHeight + 'px');
  document.documentElement.style.setProperty('--navh', ($('#read .snav')?.offsetHeight || 0) + 'px');
}
addEventListener('resize', setBarHeights);

// ---------- the changed functions in call order ----------
const FLOW = DATA.flow || [], FN = Object.fromEntries(FLOW.map(n => [n.id, n]));
const baseName = p => p.slice(p.lastIndexOf('/') + 1);
// A name two changed packages share (three mains, say) gets its package in front.
const sharedNames = new Set(FLOW.map(n => n.name).filter((name, i, all) => all.indexOf(name) !== i));
const fname = n => {
  const pkg = sharedNames.has(n.name) ? `<small>${esc(baseName(n.file.slice(0, n.file.lastIndexOf('/'))) || '.')}.</small>` : '';
  const i = n.name.indexOf('.');
  return pkg + (i < 0 ? esc(n.name) : `<small>${esc(n.name.slice(0, i))}.</small>${esc(n.name.slice(i + 1))}`);
};
const fref = id => `<a data-go="${esc(id)}">${fname(FN[id])}</a>`;
const dfsOrder = FLOW.map(n => n.id);
// The tree holds the functions the tour shows and the entry points that reach them. The panels hold every changed
// function, so the tree marks the nearest of its functions above the panel you are reading.
const inTree = new Set();
FLOW.forEach(n => {
  if (n.scene == null) return;
  inTree.add(n.id);
  let r = n;
  while (r.parent) r = FN[r.parent];
  inTree.add(r.id);
});
const treeAnchor = id => { while (id && !inTree.has(id)) id = FN[id].parent; return id; };
const treeDepth = id => { let d = 0; for (let p = FN[id].parent; p; p = FN[p].parent) d += inTree.has(p); return d; };
function flowPanel(id) {
  const n = FN[id], box = readHunk(n.window, null, null);
  $('.hhead', box).prepend(el('b', 'fname', fname(n)));
  const rel = (n.callers.length ? `called by ${n.callers.map(fref).join('')}` : 'not called by other changed code') +
    (n.calls.length ? ` · calls ${n.calls.map(fref).join('')}` : '');
  box.insertBefore(el('div', 'frel', rel), box.children[1]);
  const p = el('div', 'rcode');
  p.dataset.fid = id;
  p.appendChild(box);
  return p;
}
function flowSection() {
  const sec = el('section', 'rsec', '<div class="rhead"><span class="kicker">Call order</span><h2>Every changed function, in the order they call each other</h2></div>');
  sec.id = 'sec-flow';
  const grid = el('div', 'fgrid'), rail = el('div', 'frail'), panels = el('div', 'fpanels'), rows = {};
  dfsOrder.filter(id => inTree.has(id)).forEach(id => {
    const n = FN[id], d = treeDepth(id), r = el('a', 'frow', `${d ? '<span class="tw">↳ </span>' : ''}${fname(n)}`);
    r.style.paddingLeft = 10 + 14 * d + 'px';
    r.dataset.go = id;
    r.title = n.scene != null ? `${n.name} · in the tour: ${SC[n.scene].chapter}` : `${n.name} · an entry point`;
    rail.appendChild(r);
    rows[id] = r;
  });
  dfsOrder.forEach(id => panels.appendChild(flowPanel(id)));
  grid.append(rail, panels);
  sec.appendChild(grid);
  grid.addEventListener('click', e => {
    const a = e.target.closest('[data-go]');
    if (!a) return;
    e.preventDefault();
    const p = $$('.rcode', panels).find(x => x.dataset.fid === a.dataset.go);
    scrollTo({ top: scrollY + p.getBoundingClientRect().top - topOffset() - 12, behavior: 'smooth' });
  });
  // "You are here": the panel that has crossed a line a third of the way down the window.
  watch(() => {
    if (!sec.offsetParent) return;
    let here = dfsOrder[0];
    $$('.rcode', panels).forEach(p => { if (p.getBoundingClientRect().top < innerHeight * .33) here = p.dataset.fid; });
    const at = treeAnchor(here), row = rows[at];
    Object.entries(rows).forEach(([id, r]) => r.classList.toggle('here', id === at));
    if (row && (row.offsetTop < rail.scrollTop || row.offsetTop + row.offsetHeight > rail.scrollTop + rail.clientHeight))
      rail.scrollTo({ top: row.offsetTop - 40, behavior: 'smooth' });
  });
  return sec;
}

// ---------- the sections as a nav, like the tour's timeline ----------
// One segment per section, filling as you read through it. A click, or ← and → in read mode, goes to a section.
function sectionNav(secs, labels) {
  const nav = el('nav', 'snav');
  // A key pressed during a smooth scroll counts from where that scroll is going, not from where it is.
  let here = 0, going = null;
  addEventListener('scrollend', () => { going = null; });
  const go = i => {
    going = i;
    scrollTo({ top: scrollY + secs[i].getBoundingClientRect().top - nav.getBoundingClientRect().bottom + 1, behavior: 'smooth' });
  };
  const segs = secs.map((sec, i) => {
    const a = el('a', 'sseg', `<span class="sl"><b>${i + 1}</b>${esc(labels[i])}</span><i><u></u></i>`);
    a.title = $('h2', sec)?.textContent || labels[i];
    a.onclick = () => go(i);
    nav.appendChild(a);
    return a;
  });
  watch(() => {
    if (!nav.offsetParent) return;
    const line = nav.getBoundingClientRect().bottom + 40, end = innerHeight + scrollY >= document.documentElement.scrollHeight - 2;
    here = 0;
    secs.forEach((sec, i) => {
      const r = sec.getBoundingClientRect();
      if (r.top <= line) here = i;
      segs[i].style.setProperty('--p', end && r.top < innerHeight ? 1 : Math.max(0, Math.min(1, (line - r.top) / r.height)));
    });
    segs.forEach((s, i) => s.classList.toggle('here', i === here));
  });
  addEventListener('keydown', e => {
    if (!nav.offsetParent || e.target.closest('input, textarea') || e.metaKey || e.altKey || e.ctrlKey) return;
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    e.preventDefault();
    if (going != null) go(Math.max(0, Math.min(secs.length - 1, going + (e.key === 'ArrowRight' ? 1 : -1))));
    else if (e.key === 'ArrowRight') go(Math.min(here + 1, secs.length - 1));
    else go(secs[here].getBoundingClientRect().top < nav.getBoundingClientRect().bottom - 2 ? here : Math.max(here - 1, 0));
  });
  return nav;
}

function restSection() {
  const sec = el('section', 'rsec rest', `<div class="rhead"><span class="kicker">Not in the tour</span><h2>The rest of the diff</h2></div>`);
  sec.id = 'sec-rest';
  DATA.rest.forEach(f => {
    const d = el('details');
    const n = f.uncovered;
    d.appendChild(el('summary', '', `${esc(f.file)}<span class="cnt">${n} changed line${n === 1 ? '' : 's'} not shown in the tour</span>`));
    const box = el('div', 'rcode'); f.hunks.forEach(h => box.appendChild(readHunk(h, null, null)));
    d.appendChild(box);
    sec.appendChild(d);
  });
  return sec;
}
// ?only=N, flow or rest renders that one section, for screenshots.
function buildRead() {
  $('#read').append(pop, dock);
  $('#rtitle').innerHTML = `${esc(META.title)}<small>${linkify(esc(META.kicker))}</small>`;
  const body = $('#rbody'), only = new URLSearchParams(location.search).get('only'), secs = [], labels = [];
  SC.forEach((s, i) => { if (only == null || +only === i) { secs.push(readSection(s, i)); labels.push(s.chapter); } });
  if (FLOW.length && (only == null || only === 'flow')) { secs.push(flowSection()); labels.push('Call order'); }
  if (DATA.rest?.length && (only == null || only === 'rest')) { secs.push(restSection()); labels.push('The rest'); }
  if (only == null && secs.length > 1) body.appendChild(sectionNav(secs, labels));
  secs.forEach(s => body.appendChild(s));
}
function setMode(mode, sceneIdx) {
  if (mode === 'read' && !audio.paused) audio.pause();
  dismissStart();
  document.body.classList.toggle('mode-read', mode === 'read');
  document.body.classList.toggle('mode-tour', mode === 'tour');
  if (mode === 'read') setBarHeights();
  if (mode === 'read' && sceneIdx != null) $('#sec-' + sceneIdx)?.scrollIntoView({ block: 'start' });
  if (mode === 'tour') fit();
}
$('#playTour').onclick = () => { setMode('tour'); if (audio.paused) toggle(); };
const toggleBtn = (id, cls, invert) => { const b = $(id); b.onclick = () => { const on = document.body.classList.toggle(cls); b.classList.toggle('on', invert ? !on : on); }; };
toggleBtn('#tStruct', 'raw-diff', true);

const tip = el('div'); tip.id = 'tip'; document.body.appendChild(tip);
function placeTip(e) {
  const r = tip.getBoundingClientRect();
  const x = Math.min(e.clientX + 12, innerWidth - r.width - 8), y = e.clientY + 16 + r.height > innerHeight - 8 ? e.clientY - r.height - 10 : e.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
document.addEventListener('mouseover', e => {
  const a = e.target.closest('[data-tip]');
  if (!a) { tip.style.display = 'none'; return; }
  tip.innerHTML = `<small>${esc(a.dataset.tipMeta || '')}</small>${esc(a.dataset.tip)}`;
  tip.style.display = 'block';
  placeTip(e);
});
document.addEventListener('mousemove', e => { if (tip.style.display === 'block') placeTip(e); });

document.fonts.ready.then(() => {
  buildTour();
  (window.labRead || buildRead)();  // lab.py's page renders its experiments in place of read mode
  const q = new URLSearchParams(location.search);
  if (q.get('t')) { dismissStart(); t = +q.get('t'); }
  if (q.get('mode') === 'read') setMode('read', q.get('scene'));
  if (q.has('raw')) $('#tStruct').click();
  render(t);
  (function frame() {
    if (!audio.paused && !scrubbing) t = audio.currentTime;
    if (document.body.classList.contains('mode-tour')) render(t);
    requestAnimationFrame(frame);
  })();
});
