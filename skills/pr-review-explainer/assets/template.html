<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>PR walkthrough</title>
<style>
  :root {
    --bg: #0f1116; --panel: #161921; --panel2: #1b1e27; --line: #2a2e3b; --fg: #e3e6ec; --dim: #8b92a3;
    --blue: #6eaaff; --green: #5fd38a; --red: #f07a7a; --amber: #ffbe5a; --violet: #c38cff;
    --mono: "SF Mono", Menlo, monospace; --lh: 21px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.4 -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  body.mode-tour { height: 100%; overflow: hidden; }
  body.mode-tour #read, body.mode-read #tour { display: none; }
  a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }

  /* ================= tour (fixed 1280x720 stage) ================= */
  #tour { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage { width: 1280px; height: 720px; position: relative; overflow: hidden; transform-origin: center; background: var(--bg);
    user-select: none; -webkit-user-select: none; }
  .cd, .note .txt, .note .ref, .item .ref, .item .txt, .tests .t .name, .srow .sp, .w { user-select: text; -webkit-user-select: text; }
  #glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; left: -300px; top: -500px;
    background: radial-gradient(circle, rgba(110,170,255,.10), rgba(110,170,255,0) 65%); pointer-events: none; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .scene:not(.active) { pointer-events: none; visibility: hidden; }
  .scene.active, .scene.near { visibility: visible; }
  .head { position: absolute; left: 56px; top: 30px; right: 56px; }
  .kicker { color: var(--blue); font-size: 13px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 4px; }
  h1 { margin: 0; font-size: 30px; letter-spacing: -.4px; }

  .pane { position: absolute; left: 56px; top: 112px; width: 812px; height: 452px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .pane.wide { width: 1168px; } .pane.narrow { width: 640px; }
  .scroll { position: absolute; left: 0; right: 0; top: 0; padding: 0 0 20px; }
  .side { position: absolute; left: 890px; top: 112px; width: 334px; display: flex; flex-direction: column; gap: 12px; }
  .side.wide { left: 718px; width: 506px; }

  /* ================= shared code rows ================= */
  .hunk { margin-bottom: 14px; }
  .hhead { height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--panel2);
    border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); font-family: var(--mono); font-size: 12.5px; }
  .hunk:first-child .hhead { border-top: 0; }
  .hhead .dir { color: var(--dim); } .hhead .base { color: var(--fg); font-weight: 600; }
  .hhead .rng { margin-left: auto; color: var(--dim); }
  .hhead .newf { color: var(--green); border: 1px solid var(--green); border-radius: 4px; padding: 0 5px; font-size: 10.5px; }
  .hbody { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: #343a4a transparent; }
  .hbody::-webkit-scrollbar { height: 7px; } .hbody::-webkit-scrollbar-thumb { background: #343a4a; border-radius: 4px; }
  .rows { width: max-content; min-width: 100%; }
  .row { height: var(--lh); overflow: hidden; position: relative; display: flex;
    font-family: var(--mono); font-size: 12.5px; line-height: var(--lh); white-space: pre; tab-size: 4; }
  .gut { position: sticky; left: 0; z-index: 1; flex: none; display: inline-grid; grid-template-columns: 40px 40px 18px; background: var(--panel); }
  .row .ln { color: #4d5466; text-align: right; padding-right: 8px; }
  .row .sg { color: var(--dim); text-align: center; }
  .row .cd { padding: 0 16px 0 2px; }
  .row.add { background: rgba(95,211,138,.11); } .row.add .gut { background: #1e2e2d; } .row.add .sg { color: var(--green); }
  .row.del { background: rgba(240,122,122,.11); } .row.del .gut { background: #2e242b; } .row.del .sg { color: var(--red); }
  .row.add.newfile { background: rgba(95,211,138,.045); } .row.add.newfile .gut { background: #192126; }
  .row.cos .sg { color: #5a6175; } .row.cos .cd { opacity: .75; }
  .row.mod .sg { color: var(--amber); }
  .row .strike { position: absolute; left: 100px; right: 12px; top: 50%; height: 1px; background: rgba(240,122,122,.7); transform-origin: left center; }
  mark.x-ins { background: rgba(95,211,138,.28); color: inherit; border-radius: 3px; }
  mark.x-del { background: rgba(240,122,122,.3); color: inherit; border-radius: 3px; }
  .row.add mark.x-ins { background: rgba(95,211,138,.34); }

  /* pygments, namespaced so they can't restyle our own classes */
  .t-k, .t-kd, .t-kn, .t-kr, .t-kc, .t-kp { color: #c792ea; } .t-kt, .t-nc { color: #82aaff; }
  .t-s, .t-s1, .t-s2, .t-sr, .t-sb, .t-sc, .t-sd, .t-sh, .t-sx { color: #a8d88a; } .t-se, .t-si { color: #89ddff; }
  .t-c, .t-c1, .t-cm, .t-cp, .t-ch, .t-cs, .t-cpf { color: #6b7389; font-style: italic; }
  .t-m, .t-mi, .t-mf, .t-mh, .t-mo, .t-mb, .t-il { color: #f5a76c; }
  .t-nf, .t-fm { color: #82aaff; } .t-nb, .t-bp { color: #89ddff; } .t-o, .t-p, .t-ow { color: #a9b1c6; }
  .t-nt { color: #82aaff; } .t-na { color: #c792ea; } .t-ni { color: #f5a76c; }

  /* ================= notes ================= */
  .note { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--blue); border-radius: 10px; padding: 12px 14px; }
  .note.review { border-left-color: var(--amber); background: #1f1d1a; }
  .note .tag { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--blue); margin-bottom: 4px; }
  .note.review .tag { color: var(--amber); }
  .note .txt { font-size: 14.5px; line-height: 1.45; }
  .note .ref { font-family: var(--mono); font-size: 11.5px; color: var(--dim); margin-top: 6px; display: inline-block; }
  .note code, .w code, .item code { font-family: var(--mono); font-size: .88em; background: #252935; padding: 0 4px; border-radius: 4px; }

  /* ================= widgets (data-driven; see reference/spec.md) ================= */
  .w { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; }
  .w-title { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; color: var(--violet); margin-bottom: 8px; text-transform: uppercase; }
  .w-table { display: grid; gap: 4px 8px; align-items: start; }
  .w-table .h { color: var(--dim); font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; }
  .w-table .c { padding: 3px 7px; border-radius: 5px; background: #252935; line-height: 1.5; }
  .w-table .c.mono { font-family: var(--mono); font-size: 12px; }
  .tone-ok { color: var(--green); } .tone-bad { color: var(--red); } .tone-warn { color: var(--amber); } .tone-dim { color: var(--dim); }
  .w-table .rowwrap { display: contents; }
  .chip { display: inline-block; font-family: var(--mono); font-size: 11.5px; padding: 0 6px; border-radius: 4px; background: #2b3040; margin: 1px 0; white-space: nowrap; }
  .chip-a { background: #22324d; color: #9cc4ff; } .chip-b { background: #33284a; color: #d3b0ff; }
  .chip-c { background: #3d3220; color: #ffd08a; } .chip-d { background: #1f3a2b; color: #8fe0ad; }
  .chip-x { background: #23262f; color: #6b7389; text-decoration: line-through; }
  .w-flow { display: flex; flex-direction: column; gap: 0; }
  .fnode { background: #252935; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-family: var(--mono); font-size: 12px; }
  .fnode small { display: block; font-family: -apple-system, sans-serif; font-size: 11.5px; color: var(--dim); margin-top: 1px; }
  .fnode.tone-hot { border-color: var(--amber); } .fnode.tone-err { border-color: var(--red); background: #2c1f24; }
  .fnode.tone-ok { border-color: var(--green); } .fnode.tone-key { border-color: var(--blue); color: var(--blue); }
  .farrow { color: var(--dim); font-size: 13px; padding: 1px 0 1px 14px; }
  .fbranch { display: flex; align-items: center; gap: 6px; margin: 4px 0 2px 26px; }
  .fbranch .farrow { padding: 0; }
  .w-snippet { font-family: var(--mono); font-size: 11.5px; line-height: 1.55; background: #13151c; border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 8px; white-space: pre; overflow-x: auto; }
  .w-snippet .ln-add { background: rgba(95,211,138,.15); display: block; } .w-snippet .ln-del { background: rgba(240,122,122,.15); display: block; text-decoration: line-through; }
  .w-snippet .ln-dim { color: var(--dim); }
  .w-snippet.wrap { white-space: pre-wrap; word-break: break-word; }
  .w-snippet .ln-warn { color: var(--amber); }
  .w [data-hl].lit { box-shadow: 0 0 0 1px var(--blue); }

  /* ================= stat ================= */
  .term .cmd { height: 38px; display: flex; align-items: center; padding: 0 16px; font-family: var(--mono); font-size: 13px;
    background: var(--panel2); border-bottom: 1px solid var(--line); }
  .term .cmd .pr { color: var(--green); margin-right: 8px; }
  .cursor { display: inline-block; width: 8px; height: 15px; background: var(--fg); margin-left: 2px; vertical-align: -2px; }
  .srow { height: 18px; display: grid; grid-template-columns: 1fr 52px 52px 260px; gap: 10px; padding: 0 16px;
    font-family: var(--mono); font-size: 12px; line-height: 18px; border-radius: 4px; }
  .srow .sp .dir { color: var(--dim); } .srow .add { color: var(--green); text-align: right; } .srow .del { color: var(--red); text-align: right; }
  .srow .bar { display: flex; align-items: center; }
  .srow .bar i { display: block; height: 8px; transform-origin: left center; }
  .srow .bar .a { background: var(--green); border-radius: 2px 0 0 2px; } .srow .bar .d { background: var(--red); border-radius: 0 2px 2px 0; }
  .srow.test .sp .base { color: #b9a6e0; }
  .slist { padding-top: 8px; }
  .totals { margin-left: auto; font-family: var(--mono); font-size: 13px; color: var(--dim); }

  /* ================= summary ================= */
  .tests { position: absolute; left: 56px; top: 112px; width: 520px; }
  .tests .t { font-family: var(--mono); font-size: 13px; padding: 7px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  .tests .t .ok { color: var(--green); font-weight: 800; display: inline-block; }
  .items { position: absolute; left: 600px; top: 112px; width: 624px; display: flex; flex-direction: column; gap: 14px; }
  .item { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--amber); border-radius: 10px; padding: 14px 16px; }
  .item.nit { border-left-color: var(--dim); }
  .item .ref { font-family: var(--mono); font-size: 12px; margin-bottom: 6px; display: block; }
  .item .txt { font-size: 16px; }
  .card-title { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: var(--dim); padding: 12px 14px 8px; }

  /* ================= tour chrome ================= */
  #caption { position: absolute; left: 80px; right: 80px; bottom: 84px; min-height: 48px; color: #cfd3dc; font-size: 17px; text-align: center; }
  #controls { position: absolute; left: 40px; right: 40px; bottom: 16px; height: 52px; display: flex; align-items: center; gap: 14px; }
  button.ctl { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 8px;
    height: 34px; min-width: 40px; padding: 0 12px; font-size: 14px; cursor: pointer; font-family: inherit; }
  button.ctl:hover { border-color: var(--blue); }
  button.ctl.on { border-color: var(--blue); color: var(--blue); }
  #time { font-family: var(--mono); font-size: 13px; color: var(--dim); width: 96px; text-align: center; }
  #speed { width: 64px; font-family: var(--mono) !important; }
  #bar { position: relative; flex: 1; height: 34px; cursor: pointer; touch-action: none; }
  #track { position: absolute; left: 0; right: 0; top: 20px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  #fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); width: 0; }
  #knob { position: absolute; top: 15px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px rgba(110,170,255,.35); }
  .chapter { position: absolute; top: 0; height: 18px; font-size: 10.5px; color: var(--dim); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; padding-left: 5px; border-left: 1px solid var(--line); }
  .chapter.cur { color: var(--fg); }
  .tick { position: absolute; top: 18px; width: 2px; height: 10px; background: var(--bg); }
  #start { position: absolute; inset: 0 0 80px 0; display: grid; place-items: center; background: rgba(10,12,16,.55); z-index: 5; cursor: pointer; }
  #start .go { background: var(--blue); color: #0b1020; font-weight: 700; font-size: 22px; padding: 16px 34px; border-radius: 40px; }
  #start .alt { margin-top: 14px; font-size: 14px; color: var(--dim); text-align: center; }
  #start .alt a { cursor: pointer; }
  #silent { position: absolute; right: 56px; top: 34px; font-size: 11px; color: var(--amber); border: 1px solid var(--amber); border-radius: 5px; padding: 1px 6px; }

  /* ================= read (scrolling document) ================= */
  #read { max-width: 1320px; margin: 0 auto; padding: 0 28px 120px; font-size: 15px; }
  #rbar { position: sticky; top: 0; z-index: 10; background: rgba(15,17,22,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line);
    margin: 0 -28px; padding: 10px 28px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #rbar .ttl { font-weight: 650; margin-right: auto; font-size: 15px; }
  #rbar .ttl small { color: var(--dim); font-weight: 400; margin-left: 8px; }
  #read h2 { font-size: 22px; margin: 0; letter-spacing: -.2px; }
  .rsec { padding: 30px 0 8px; border-bottom: 1px solid var(--line); scroll-margin-top: 50px; }
  #read .row.rfold { cursor: pointer; color: var(--dim); font-family: -apple-system, sans-serif; font-size: 12px; }
  #read .row.rfold:hover { color: var(--blue); }
  #read .row.rfolded { display: none; }
  #layout-errors { position: absolute; left: 0; right: 0; top: 0; z-index: 9; background: #7a1f1f; color: #fff; font: 12px var(--mono); padding: 4px 10px; }
  .rsec .rhead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .rsec .rhead .kicker { margin: 0; }
  .rsec .rhead button { margin-left: auto; }
  .rgrid { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 18px; align-items: start; }
  .rgrid.wide { grid-template-columns: minmax(0, 1fr) 520px; }
  .rgrid.solo { grid-template-columns: minmax(0, 1fr); }
  .rcode { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  #read .row { height: auto; }
  .rsteps { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 64px; }
  .rstep { border-left: 2px solid var(--line); padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 8px; }
  .rstep .say { color: #c5cad6; font-size: 14px; line-height: 1.5; }
  .rstep:hover { border-left-color: var(--blue); }
  .rstep:hover .say { color: var(--fg); }
  #read .row.hot { box-shadow: inset 3px 0 0 0 var(--blue); background-color: rgba(110,170,255,.10); }
  #read .row.hot .gut { background: #1d2433; }
  .rstat .srow { height: 20px; line-height: 20px; }
  .rest details { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin: 10px 0; overflow: hidden; }
  .rest summary { cursor: pointer; padding: 8px 14px; font-family: var(--mono); font-size: 12.5px; }
  .rest summary .cnt { color: var(--dim); margin-left: 8px; }
  body:not(.raw-diff) .rows.raw, body.raw-diff .rows.struct { display: none; }
  #tip { position: fixed; z-index: 50; display: none; max-width: 380px; padding: 7px 10px; border-radius: 8px; pointer-events: none;
    background: #232734; border: 1px solid #39405a; box-shadow: 0 6px 24px rgba(0,0,0,.45); color: var(--fg); font: 13px/1.4 -apple-system, sans-serif; }
  #tip small { display: block; margin-bottom: 2px; color: var(--dim); font: 11px var(--mono); }
</style>
</head>
<body class="mode-tour">
<div id="tour"><div id="stage">
  <div id="glow"></div>
  <div id="scenes"></div>
  <div id="caption"></div>
  <div id="controls">
    <button class="ctl" id="play" title="Play / pause (space)">▶</button>
    <div id="time">0:00 / 0:00</div>
    <div id="bar"><div id="track"><div id="fill"></div></div><div id="knob"></div></div>
    <button class="ctl" id="speed" title="Playback speed ( - / = )">1×</button>
    <button class="ctl" id="toRead" title="Read this part as a document (r)">Read</button>
  </div>
  <div id="start"><div><div class="go">▶ Play walkthrough</div><div class="alt">or <a id="startRead">read it as a document</a></div></div></div>
</div></div>

<div id="read">
  <div id="rbar">
    <span class="ttl" id="rtitle"></span>
    <button class="ctl" id="playTour">▶ Play tour</button>
    <button class="ctl on" id="tStruct" title="Hide whitespace-only changes and mark changed tokens (difftastic)">Structural diff</button>
  </div>
  <div id="rbody"></div>
</div>

<script>
const DATA = /*DATA*/null;
const D = DATA.duration, SC = DATA.scenes, META = DATA.meta;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const LH = 21, HHEAD = 32, HGAP = 14, PANE_H = 452;
const SIDE_MAX = 470;  // side column top (112) to just above the caption (588)
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const splitPath = p => { const i = p.lastIndexOf('/'); return `<span class="path"><span class="dir">${esc(p.slice(0, i + 1))}</span><span class="base">${esc(p.slice(i + 1))}</span></span>`; };
// Ticket keys from the spec's Jira projects and #N references to this repo's PRs become links.
const JIRA = META.jira?.projects?.length ? new RegExp(`\\b(?:${META.jira.projects.join('|')})-\\d+\\b`, 'g') : null;
// Titles fetched at build time show in a hover card (see the #tip handlers at the end).
const REFS = META.refs || {};
const link = (href, text, key) => {
  const r = REFS[key];
  const tip = r ? ` data-tip="${esc(r.title)}" data-tip-meta="${esc(key + (r.state ? ' · ' + r.state : ''))}"` : '';
  return `<a href="${esc(href)}" target="_blank" rel="noopener"${tip}>${text}</a>`;
};
const linkify = html => {
  if (JIRA) html = html.replace(JIRA, k => link(`${META.jira.site}/browse/${k}`, k, k));
  return html.replace(/(^|[^&\w])#(\d+)\b/g, (_, pre, n) => pre + link(`https://github.com/${META.github}/pull/${n}`, '#' + n, '#' + n));
};
// Inline markup for note, widget, step and item text: `code`, **bold**, ~~strike~~, {a:chip}.
const md = s => linkify(esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
  .replace(/~~([^~]+)~~/g, '<s>$1</s>').replace(/\{([a-z]):([^}]+)\}/g, '<span class="chip chip-$1">$2</span>'));
const refLink = r => r ? `<a class="ref" href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a>` : '';
document.title = META.title;

// ================= timeline engine: paused WAAPI animations driven by the clock =================
const EASE = 'cubic-bezier(.22,.9,.25,1)';
const groups = SC.map(() => []), globalTracks = [], customs = [];
let curGroup = globalTracks;
function track(target, frames) {
  frames = frames.slice().sort((a, b) => a[0] - b[0]);
  const t0 = frames[0][0], dur = Math.max(frames.at(-1)[0] - t0, 0.001);
  const anim = target.animate(frames.map(([t, k]) => ({ easing: EASE, ...k, offset: (t - t0) / dur })), { duration: dur * 1000, fill: 'both' });
  anim.pause();
  curGroup.push({ anim, t0, dur });
}
const custom = (t0, dur, fn) => customs.push({ t0, dur, fn });
const rise = (e, t, dy = 14, d = .5) => track(e, [[t, { opacity: 0, transform: `translateY(${dy}px)` }], [t + d, { opacity: 1, transform: 'translateY(0px)' }]]);
const grow = (e, t, d = .5) => track(e, [[t, { transform: 'scaleX(0)' }], [t + d, { transform: 'scaleX(1)' }]]);
function onPanel(rgb, a) { const base = [22, 25, 33]; return `rgb(${base.map((b, i) => Math.round(b + (rgb[i] - b) * a)).join(',')})`; }

// ================= code rows (shared by both modes) =================
const KIND = { '+': 'add', '-': 'del', ' ': 'ctx', '~': 'cos', '±': 'mod' };
const SIGN = { '+': '+', '-': '−', ' ': '', '~': '≈', '±': '±' };
function rowEl(r, isNew) {
  const cls = KIND[r.k] + (r.k === '+' && isNew ? ' newfile' : '');
  const row = el('div', 'row ' + cls);
  const gut = el('span', 'gut');
  gut.append(el('span', 'ln', r.o ?? ''), el('span', 'ln', r.n ?? ''), el('span', 'sg', SIGN[r.k]));
  row.append(gut, el('span', 'cd', r.h || ' '));

  for (const [rows, cls] of [[h.rows, 'struct'], [h.raw || h.rows, 'raw']]) {
    const list = el('div', 'rows ' + cls);
    const plan = cls === 'struct' ? foldPlan(rows, focused) : rows.map(() => null);
    let group = null;
    rows.forEach((r, ri) => {
      const p = plan[ri];
      if (p && p.start === ri) {
        group = 'f' + foldSeq++;
        const g = group, n = p.n, fold = el('div', 'row rfold');
        const label = open => `<span class="gut"><span class="ln"></span><span class="ln"></span><span class="sg">${open ? '▾' : '▸'}</span></span>` +
          `<span class="cd">${open ? `collapse these ${n} lines` : `${n} lines not covered by the narration`}</span>`;
        fold.innerHTML = label(false);
        fold.onclick = () => {
          const open = fold.classList.toggle('open');
          fold.innerHTML = label(open);
          $$(`#read .row[data-fold="${g}"]`).forEach(x => x.classList.toggle('rfolded', !open));
        };
        list.appendChild(fold);
      }
      const row = rowEl(r, h.isNew);
      if (cls === 'struct' && si != null) row.dataset.key = `${si}:${hi}:${ri}`;
      if (p) { row.classList.add('rfolded'); row.dataset.fold = group; }
      list.appendChild(row);
    });
    body.appendChild(list);
  }
  box.appendChild(body);
  return box;
}
function hotRows(si, rows, on) {
  (rows || []).forEach(([h, r]) => $(`#read .row[data-key="${si}:${h}:${r}"]`)?.classList.toggle('hot', on));
}
function readSection(scene, si) {
  const sec = el('section', 'rsec');
  sec.id = 'sec-' + si;
  const head = el('div', 'rhead', `<span class="kicker">${esc(scene.chapter)}</span><h2>${linkify(esc(scene.title))}</h2>`);
  const play = el('button', 'ctl', '▶ from here');
  play.onclick = () => { setMode('tour'); seek(scene.start + .01); if (audio.paused) toggle(); };
  head.appendChild(play);
  sec.appendChild(head);
  if (scene.kind === 'stat') {
    const box = el('div', 'rcode rstat term');
    box.appendChild(el('div', 'cmd', `<span class="pr">$</span>${esc(META.statCommand)}<span class="totals">${totals()}</span>`));
    const list = el('div', 'slist'); statRows(list, null); box.appendChild(list);
    sec.appendChild(box);
    sec.appendChild(stepsFor(scene, si));
    return sec;
  }
  if (scene.kind === 'summary') {
    const g = el('div', 'rgrid');
    const tests = el('div', 'rcode');
    tests.appendChild(el('div', 'card-title', 'TESTS'));
    (scene.tests || []).forEach(n => tests.appendChild(el('div', 'row', `<span class="cd">✓ ${esc(n)}</span>`)));
    const items = el('div', 'rsteps');
    scene.items.forEach(it => items.appendChild(itemEl(it)));
    g.append(tests, items);
    sec.appendChild(g);
    sec.appendChild(stepsFor(scene, si));
    return sec;
  }
  const g = el('div', 'rgrid' + (scene.side === 'wide' ? ' wide' : ''));
  const code = el('div', 'rcode');
  scene.hunks.forEach((h, hi) => code.appendChild(readHunk(h, si, hi)));
  g.append(code, stepsFor(scene, si));
  sec.appendChild(g);
  return sec;
}
// One block per narrated cue: the caption, then any note or widget it introduces. Hovering lights its rows.
function stepsFor(scene, si) {
  const col = el('div', 'rsteps');
  const seen = new Set();
  scene.cues.forEach(c => {
    const step = el('div', 'rstep');
    step.appendChild(el('div', 'say', md(c.text)));
    const acts = scene.actions.filter(a => a.cue === c.i);
    let rows = [];
    for (const a of acts) {
      if (a.type === 'focus') rows = rows.concat(a.rows);
      if (a.type === 'note') { const n = noteEl(a); n.onmouseenter = () => hotRows(si, a.rows, true); n.onmouseleave = () => hotRows(si, a.rows, false); step.appendChild(n); }
      if (a.type === 'widget' && !seen.has(a.name)) { seen.add(a.name); step.appendChild(W[scene.widgets[a.name].kind](scene.widgets[a.name])); }
    }
    step.onmouseenter = () => hotRows(si, rows, true);
    step.onmouseleave = () => hotRows(si, rows, false);
    col.appendChild(step);
  });
  return col;
}
function buildRead() {
  $('#rtitle').innerHTML = `${esc(META.title)}<small>${linkify(esc(META.kicker))}</small>`;
  const body = $('#rbody'), only = new URLSearchParams(location.search).get('only');
  SC.forEach((s, i) => { if (only == null || +only === i) body.appendChild(readSection(s, i)); });
  if (DATA.rest?.length && (only == null || only === 'rest')) {
    const sec = el('section', 'rsec rest', `<div class="rhead"><span class="kicker">Not in the tour</span><h2>The rest of the diff</h2></div>`);
    DATA.rest.forEach(f => {
      const d = el('details');
      const n = f.uncovered;
      d.appendChild(el('summary', '', `${esc(f.file)}<span class="cnt">${n} changed line${n === 1 ? '' : 's'} not shown in the tour</span>`));
      const box = el('div', 'rcode'); f.hunks.forEach(h => box.appendChild(readHunk(h, null, null)));
      d.appendChild(box);
      sec.appendChild(d);
    });
    body.appendChild(sec);
  }
}
function setMode(mode, sceneIdx) {
  if (mode === 'read' && !audio.paused) audio.pause();
  dismissStart();
  document.body.classList.toggle('mode-read', mode === 'read');
  document.body.classList.toggle('mode-tour', mode === 'tour');
  if (mode === 'read' && sceneIdx != null) $('#sec-' + sceneIdx)?.scrollIntoView({ block: 'start' });
  if (mode === 'tour') fit();
}
$('#playTour').onclick = () => { setMode('tour'); if (audio.paused) toggle(); };
const toggleBtn = (id, cls, invert) => { const b = $(id); b.onclick = () => { const on = document.body.classList.toggle(cls); b.classList.toggle('on', invert ? !on : on); }; };
toggleBtn('#tStruct', 'raw-diff', true);

const tip = el('div'); tip.id = 'tip'; document.body.appendChild(tip);
function placeTip(e) {
  const r = tip.getBoundingClientRect();
  const x = Math.min(e.clientX + 12, innerWidth - r.width - 8), y = e.clientY + 16 + r.height > innerHeight - 8 ? e.clientY - r.height - 10 : e.clientY + 16;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
document.addEventListener('mouseover', e => {
  const a = e.target.closest('[data-tip]');
  if (!a) { tip.style.display = 'none'; return; }
  tip.innerHTML = `<small>${esc(a.dataset.tipMeta || '')}</small>${esc(a.dataset.tip)}`;
  tip.style.display = 'block';
  placeTip(e);
});
document.addEventListener('mousemove', e => { if (tip.style.display === 'block') placeTip(e); });

document.fonts.ready.then(() => {
  buildTour();
  buildRead();
  const q = new URLSearchParams(location.search);
  if (q.get('t')) { dismissStart(); t = +q.get('t'); }
  if (q.get('mode') === 'read') setMode('read', q.get('scene'));
  if (q.has('raw')) $('#tStruct').click();
  render(t);
  (function frame() {
    if (!audio.paused && !scrubbing) t = audio.currentTime;
    if (document.body.classList.contains('mode-tour')) render(t);
    requestAnimationFrame(frame);
  })();
});
</script>
</body>
