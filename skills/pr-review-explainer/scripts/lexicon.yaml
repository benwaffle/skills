# Pronunciations the voices get wrong. Shared across every PR, so add terms here as you find them.
# `spell` terms are read letter by letter by every voice (SAR -> "ess ay ar").
# Other terms are written out twice: `ipa` for Kokoro, which reads phonemes, and `text` for Breeze and the other
# mlx voices, which read a plain-text respelling. A term with no `text` entry is read as written by those voices.
# A spec can add its own with `lexicon: {TERM: spell}`, `{TERM: "<ipa>"}` or `{TERM: {ipa: ..., text: ...}}`.
# Check the "spoken as" dump the build prints for any cue with capitals or digits.

spell:
  # general
  - PR
  - ID
  - API
  - CI
  - DB
  - SQL
  - XML
  - XSD
  - URI
  - URL
  - HTTP
  - TLS
  - AWS
  - TTL
  - UUID
  # 4G / 5G / IMS
  - IMS
  - SMS
  - HSS
  - UDM
  - UDR
  - MME
  - AMF
  - SMF
  - AVP
  - AVPs
  - ULR
  - AIR
  - PUR
  - ULA
  - CLR
  - CLA
  - RTR
  - RTA
  - UE
  - NOR
  - SAR
  - SAA
  - MAR
  - MAA
  - UAR
  - LIR
  - PLMN
  - SMSC
  - SPT
